# Netlify build and hosting for the CMS admin.
#
# Kept in the repo rather than clicked into the dashboard, so the configuration
# is reviewable and a rebuilt site cannot quietly lose its redirect rules.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # ⚠ Pinned rather than left to Netlify's default, which moves over time. The
  # API pins the same major for the same reason — a runtime that upgrades under
  # you is how a build breaks with no code change.
  NODE_VERSION = "22"

# ⚠ THE LOAD-BEARING RULE. This is a single-page app: the server has no file at
# /event-registrations, so without this a refresh or a pasted deep link returns
# Netlify's own 404 instead of the app.
#
# It must be a 200 REWRITE, not a 301 redirect — the URL has to stay as it was,
# because React Router reads the path to decide which screen to show.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    # ⚠ An internal tool. It should never appear in a search result.
    X-Robots-Tag = "noindex, nofollow"
    X-Content-Type-Options = "nosniff"
    # Nothing here should ever be framed — this app holds a session token.
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Vite fingerprints these filenames, so a given URL's contents never change and
# it can be cached for as long as the browser likes. index.html deliberately is
# NOT cached this way — it is what points at the current build.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
