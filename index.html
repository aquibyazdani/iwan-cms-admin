<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Iwan CMS</title>
    <meta name="description" content="Content management for iwan.community" />
    <!-- An internal tool: nothing here should ever appear in a search result. -->
    <meta name="robots" content="noindex, nofollow" />
    <!-- Same icon set as the public site (iwan/public), so the CMS tab is
         recognisably Iwan rather than a generic placeholder. -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <script>
      /* Applied before first paint so a dark-mode session never flashes white.
         Inline on purpose — a module import would run a frame too late. */
      (function () {
        try {
          var saved = localStorage.getItem("iwan-cms.theme");
          var dark =
            saved === "dark" ||
            (!saved && matchMedia("(prefers-color-scheme: dark)").matches);
          if (dark) document.documentElement.setAttribute("data-theme", "dark");
        } catch (e) {
          /* private browsing throws rather than returning null — light it is */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
